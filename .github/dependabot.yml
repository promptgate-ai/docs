# Dependabot configuration — PromptGate documentation.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One PR per ecosystem instead of one per package (separate one for
    # security fixes so they never wait on a breaking bump).
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      all:
        applies-to: version-updates
        patterns: ["*"]
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore(npm)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # One PR per ecosystem instead of one per package (separate one for
    # security fixes so they never wait on a breaking bump).
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      all:
        applies-to: version-updates
        patterns: ["*"]
    labels:
      - dependencies
      - actions
    commit-message:
      prefix: chore(actions)
